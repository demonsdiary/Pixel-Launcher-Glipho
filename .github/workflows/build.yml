name: Generate Web App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          npm run build --if-present
          mkdir -p dist
          touch dist/index.html

      - name: Initialize Capacitor Layout
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "My Launcher App" "com.example.mylauncher" --web-dir=dist
          npx cap add android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21' # Upgraded from 17 to fix the compiler error

      - name: Build APK File
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: web-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
