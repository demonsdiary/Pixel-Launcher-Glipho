name: Generate Web App APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: |
          npm run build --if-present
          mkdir -p dist
          touch dist/index.html

      - name: Initialize Capacitor Layout
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "My Launcher App" "com.example.mylauncher" --web-dir=dist
          npx cap add android

      - name: Inject True Android Launcher Configuration
        run: |
          node -e '
          const fs = require("fs");
          const path = "android/app/src/main/AndroidManifest.xml";
          let content = fs.readFileSync(path, "utf8");
          
          // Remove default intent-filters to avoid duplication or parsing conflicts
          content = content.replace(/<intent-filter>([\s\S]*?)<\/intent-filter>/g, "");
          
          // Inject a valid intent-filter structure directly inside the main activity element
          const target = "<activity";
          const injection = `\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.HOME" />\n                <category android:name="android.intent.category.DEFAULT" />\n            </intent-filter>`;
          
          const index = content.indexOf(target);
          if (index !== -1) {
            const insertPos = content.indexOf(">", index) + 1;
            content = content.slice(0, insertPos) + injection + content.slice(insertPos);
          }
          
          fs.writeFileSync(path, content, "utf8");
          '

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK File
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: web-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
